name: Ox
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  SwiftGitX:
    url: https://github.com/ibrahimcetin/SwiftGitX
    exactVersion: 0.4.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
targets:
  mac:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Validate agent bundle
        script: sh "$SRCROOT/../shared/validate-agent-bundle.sh"
        basedOnDependencyAnalysis: false
    sources:
      - path: Client
      - path: Runtime
      - path: Resources
      - path: Diagnostics
      - path: ../shared/Runtime
      - path: ../shared/Platform/Models
      - path: ../shared/Diagnostics
      - path: ../shared/Resources/OxServices.bundle
        type: file
        buildPhase: resources
      - path: ../shared/Resources/PiDurable.bundle
        type: file
        buildPhase: resources
      - path: ../shared/Resources/PublicSuffixList.bundle
        type: file
        buildPhase: resources
      - path: ../shared/Resources/Localizations
      - path: ../shared/Resources/ModelServiceActions.json
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Ox
        CFBundleIconFile: AppIcon
        NSContactsUsageDescription: Ox accesses contacts when you request contact lookup.
        NSCalendarsWriteOnlyAccessUsageDescription: Ox adds calendar events when you request them.
        NSRemindersFullAccessUsageDescription: Ox adds reminders when you request them.
        NSLocationUsageDescription: Ox uses your location for nearby places and routes.
        NSLocationWhenInUseUsageDescription: Ox uses your location for nearby places and routes.
        OXAppGroupIdentifier: group.ai.openox.mac.local
        OXICloudContainerIdentifier: iCloud.ai.openox.mac.local
        OXKeychainService: ai.openox.mac.local.llm
        OXWebsiteDataNamespace: ai.openox.mac.local.web-profile
        OXAgentSkillTypeIdentifier: ai.openox.agent-skill
        OXConversationTypeIdentifier: ai.openox.conversation
        OXServiceTypeIdentifier: ai.openox.service
    dependencies:
      - package: SwiftGitX
    settings:
      base:
        PRODUCT_NAME: Ox
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: ai.openox.mac.local
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        LM_SKIP_METADATA_EXTRACTION: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG OX_DEBUG_LOOPBACK $(inherited)
