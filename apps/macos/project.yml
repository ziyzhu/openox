name: OxHost
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  SwiftGitX:
    url: https://github.com/ibrahimcetin/SwiftGitX
    exactVersion: 0.4.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
targets:
  host:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Validate agent bundle
        script: sh "$SRCROOT/../shared/validate-agent-bundle.sh"
        basedOnDependencyAnalysis: false
    sources:
      - path: Host
      - path: Resources
      - path: Diagnostics
      - path: ../shared/Host
      - path: ../shared/Platform/Models
      - path: ../shared/Diagnostics
      - path: ../shared/Resources/OxServices.bundle
        type: file
        buildPhase: resources
      - path: ../shared/Resources/PiDurable.bundle
        type: file
        buildPhase: resources
      - path: ../shared/Resources/PublicSuffixList.bundle
        type: file
        buildPhase: resources
      - path: ../shared/Resources/Localizations
      - path: ../shared/Resources/ModelServiceActions.json
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Ox Host
        NSContactsUsageDescription: Ox Host accesses contacts when you request contact lookup.
        NSCalendarsWriteOnlyAccessUsageDescription: Ox Host adds calendar events when you request them.
        NSRemindersFullAccessUsageDescription: Ox Host adds reminders when you request them.
        NSLocationUsageDescription: Ox Host uses your location for nearby places and routes.
        NSLocationWhenInUseUsageDescription: Ox Host uses your location for nearby places and routes.
        OXAppGroupIdentifier: group.ai.openox.host.local
        OXICloudContainerIdentifier: iCloud.ai.openox.host.local
        OXKeychainService: ai.openox.host.local.llm
        OXWebsiteDataNamespace: ai.openox.host.local.web-profile
        OXAgentSkillTypeIdentifier: ai.openox.agent-skill
        OXChatTypeIdentifier: ai.openox.chat
        OXServiceTypeIdentifier: ai.openox.service
    dependencies:
      - package: SwiftGitX
    settings:
      base:
        PRODUCT_NAME: OxHost
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: ai.openox.host.local
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: host.entitlements
        ENABLE_HARDENED_RUNTIME: YES
