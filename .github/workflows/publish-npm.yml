name: Publish npm Package

on:
  push:
    tags:
      - "ox-cli-v*"
      - "service-sdk-v*"
      - "services-v*"

permissions: {}

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install current npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Resolve release
        id: release
        run: |
          case "$GITHUB_REF_NAME" in
            ox-cli-v*) package_directory="apps/cli"; package_key="cli"; tag_prefix="ox-cli-v" ;;
            service-sdk-v*) package_directory="packages/service-sdk"; package_key="service-sdk"; tag_prefix="service-sdk-v" ;;
            services-v*) package_directory="packages/services"; package_key="services"; tag_prefix="services-v" ;;
            *) exit 1 ;;
          esac
          version="$(node -p "require('./$package_directory/package.json').version")"
          test "$GITHUB_REF_NAME" = "$tag_prefix$version"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "package_directory=$package_directory" >> "$GITHUB_OUTPUT"
          echo "package_key=$package_key" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify repository
        run: |
          bun run typecheck
          bun run test:unit
          bun run build:web-worker
          git diff --exit-code -- apps/ios/OpenOx/Host/Services/Web/PublicWeb/PublicWebWorker.js
          bun run build:services
          git diff --exit-code -- apps/ios/OpenOx/Resources/OxServices.bundle

      - name: Build and verify package
        run: bun "${{ steps.release.outputs.package_directory }}/package-check.ts" --output "$RUNNER_TEMP/npm-package"

      - name: Resolve tarball
        id: artifact
        run: |
          mapfile -t tarballs < <(find "$RUNNER_TEMP/npm-package" -maxdepth 1 -name '*.tgz' -type f)
          test "${#tarballs[@]}" -eq 1
          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish package
        run: |
          bun tooling/npm-publish.ts \
            --directory "${{ steps.release.outputs.package_key }}" \
            --tarball "${{ steps.artifact.outputs.tarball }}"
