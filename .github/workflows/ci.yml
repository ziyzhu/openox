name: CI

on:
  push:
    branches: [main]
    paths:
      - "ox-cli/**"
      - "dev/**"
      - "tooling/**"
      - "scripts/**"
      - "services/**"
      - "examples/service-repository/**"
      - "ios/ios/OxServices.bundle/**"
      - "ios/**/*.xcstrings"
      - ".agents/skills/ox-debug/**"
      - ".agents/skills/add-web-service/**"
      - ".agents/skills/explore-service/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ox-cli/**"
      - "dev/**"
      - "tooling/**"
      - "scripts/**"
      - "services/**"
      - "examples/service-repository/**"
      - "ios/ios/OxServices.bundle/**"
      - "ios/**/*.xcstrings"
      - ".agents/skills/ox-debug/**"
      - ".agents/skills/add-web-service/**"
      - ".agents/skills/explore-service/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Typecheck
        run: bun install --frozen-lockfile && bun run typecheck

      - name: Test service builder
        run: bun run test:service-builder

      - name: Verify generated service bundle
        run: bun run build:services && git diff --exit-code -- ios/ios/OxServices.bundle
