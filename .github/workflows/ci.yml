name: CI

on:
  push:
    branches: [main]
    paths:
      - "ox-cli/**"
      - "dev/**"
      - "tooling/**"
      - "scripts/**"
      - "service-sdk/**"
      - "services/**"
      - "examples/service-repository/**"
      - "ios/ios/OxServices.bundle/**"
      - "ios/tests/**"
      - "ios/**/*.xcstrings"
      - ".agents/skills/ox-debug/**"
      - ".agents/skills/promote-web-service/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish-npm.yml"
  pull_request:
    branches: [main]
    paths:
      - "ox-cli/**"
      - "dev/**"
      - "tooling/**"
      - "scripts/**"
      - "service-sdk/**"
      - "services/**"
      - "examples/service-repository/**"
      - "ios/ios/OxServices.bundle/**"
      - "ios/tests/**"
      - "ios/**/*.xcstrings"
      - ".agents/skills/ox-debug/**"
      - ".agents/skills/promote-web-service/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Typecheck
        run: bun install --frozen-lockfile && bun run typecheck

      - name: Test service builder
        run: bun run test:service-builder

      - name: Verify generated service bundle
        run: bun run build:services && git diff --exit-code -- ios/ios/OxServices.bundle

      - name: Verify npm packages
        run: |
          bun run --cwd service-sdk package:check
          bun run --cwd services package:check
          bun run --cwd ox-cli package:check
