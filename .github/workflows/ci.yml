name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'ios-upload' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Check iOS build inputs across the push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BEFORE"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git hash-object -w -t tree /dev/null)"
          elif ! git cat-file -e "$base^{commit}"; then
            git fetch --no-tags origin "$base"
          fi
          git diff --no-renames --name-only -z "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/ios-changed-paths"
          relevant=false
          while IFS= read -r -d '' path; do
            case "$path" in
              apps/ios/*|apps/shared/*|packages/agent/src/*|packages/agent/skills/*|packages/protocol/src/*|\
              packages/agent/build.ts|packages/agent/native-guidance.ts|packages/agent/tsconfig.json|packages/agent/UPSTREAM_LICENSE.txt|packages/protocol/tsconfig.json|\
              package.json|*/package.json|bun.lock|bunfig.toml|.npmrc|.bun-version|.github/ci.json|\
              .agents/lib.ts|.agents/skills/build/scripts/*|.agents/skills/release/scripts/ios-upload.sh|\
              .github/workflows/ci.yml|.github/workflows/ios-prepare.yml|.github/workflows/ios-release.yml)
                relevant=true
                printf 'iOS input matched: %q\n' "$path"
                break
                ;;
            esac
          done < "$RUNNER_TEMP/ios-changed-paths"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "iOS build inputs changed: $relevant" >> "$GITHUB_STEP_SUMMARY"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - id: config
        run: |
          bun --no-env-file -e 'const c = require("./.github/ci.json"); console.log(`node=${c.node}\nnpm=${c.npm}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.config.outputs.node }}
          check-latest: true
          package-manager-cache: false
      - run: npm install --global "npm@${{ steps.config.outputs.npm }}" --ignore-scripts
      - run: bun run ci

  apps:
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [ios, macos]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: |
          version="$(bun --no-env-file -p 'require("./.github/ci.json").xcode')"
          echo "DEVELOPER_DIR=/Applications/Xcode_$version.app/Contents/Developer" >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - run: git config --global lfs.fetchexclude 'prebuilt/**'
      - run: bun run ci --${{ matrix.target }}-only

  ios-prepare:
    needs: ios-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && needs.ios-changes.outputs.relevant == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ios-prepare.yml
    with:
      mode: upload
    secrets: inherit

  testflight:
    needs: [ios-changes, checks, apps, ios-prepare]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && needs.ios-changes.outputs.relevant == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ios-release.yml
    with:
      mode: upload
      prepared-build: ${{ needs.ios-prepare.outputs.build }}
      prepared-artifact: ${{ needs.ios-prepare.outputs.artifact }}
    secrets: inherit
