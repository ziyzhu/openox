name: Verify Standalone CLI

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "apps/cli/**"
      - "packages/service-sdk/**"
      - "examples/service-repository/**"
      - "tooling/cli-installer.test.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - ".github/workflows/cli-standalone.yml"
      - ".github/workflows/publish-npm.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/cli/**"
      - "packages/service-sdk/**"
      - "examples/service-repository/**"
      - "tooling/cli-installer.test.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - ".github/workflows/cli-standalone.yml"
      - ".github/workflows/publish-npm.yml"

permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-x64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Verify installer
        run: bun run --cwd apps/cli test:installer
      - name: Build and exercise standalone executable
        run: |
          test "$(bun -p 'process.platform + "-" + process.arch')" = "${{ matrix.platform }}"
          bun run --cwd apps/cli standalone:check --out "$RUNNER_TEMP/ox-cli-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ox-cli-${{ matrix.platform }}
          path: ${{ runner.temp }}/ox-cli-artifacts/*
          if-no-files-found: error
          retention-days: 7
