name: Verify Standalone CLI

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".agents/skills/build/checks/**"
      - ".agents/skills/build/scripts/**"
      - "tsconfig.base.json"
      - "apps/cli/**"
      - "packages/protocol/**"
      - "packages/services/**"
      - "examples/repository/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/ci.json"
      - ".github/workflows/cli.yml"
      - ".github/workflows/npm-release.yml"
  pull_request:
    branches: [main]
    paths:
      - ".agents/skills/build/checks/**"
      - ".agents/skills/build/scripts/**"
      - "tsconfig.base.json"
      - "apps/cli/**"
      - "packages/protocol/**"
      - "packages/services/**"
      - "examples/repository/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/ci.json"
      - ".github/workflows/cli.yml"
      - ".github/workflows/npm-release.yml"

permissions: {}

jobs:
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: config
        run: |
          python3 -c 'import json; print("matrix=" + json.dumps({"include": json.load(open(".github/ci.json"))["cli"]}))' >> "$GITHUB_OUTPUT"

  build:
    needs: platforms
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Verify standalone CLI
        run: |
          test "$(bun -p 'process.platform + "-" + process.arch')" = "${{ matrix.platform }}"
          bun run ci --standalone-only --out "$RUNNER_TEMP/ox-cli-artifacts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ox-cli-${{ matrix.platform }}
          path: ${{ runner.temp }}/ox-cli-artifacts/*
          if-no-files-found: error
          retention-days: 7
