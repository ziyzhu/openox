name: iOS Upload

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: dry-run
      build:
        type: string
        default: ""
      prepared-build:
        type: string
        default: ""
      prepared-artifact:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run exports and verifies the signed IPA; upload also sends it to App Store Connect
        type: choice
        options: [dry-run, upload]
        default: dry-run
      build:
        description: Build number (empty uses the next number after the highest uploaded build)
        type: string
        required: false

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ios-upload' || format('ios-upload-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.prepared-build == ''
    permissions:
      contents: read
    uses: ./.github/workflows/ios-prepare.yml
    with:
      mode: ${{ inputs.mode }}
      build: ${{ inputs.build }}
    secrets: inherit

  upload:
    needs: prepare
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.mode == 'upload' && (needs.prepare.result == 'success' || (needs.prepare.result == 'skipped' && inputs.prepared-build != '')) }}
    runs-on: macos-26
    timeout-minutes: 30
    environment: appstore
    permissions:
      contents: read
    env:
      ASC_BYPASS_KEYCHAIN: "1"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      OX_BUNDLE_IDENTIFIER: ${{ vars.OX_BUNDLE_IDENTIFIER }}
      BUILD: ${{ inputs.prepared-build || needs.prepare.outputs.build }}
      ARTIFACT: ${{ inputs.prepared-artifact || needs.prepare.outputs.artifact }}
    steps:
      - name: Check build source credential
        if: inputs.mode == 'upload'
        env:
          BUILD_SOURCE_TOKEN: ${{ secrets.BUILD_SOURCE_TOKEN }}
        run: |
          if [ -z "$BUILD_SOURCE_TOKEN" ]; then
            echo "::error::Set the appstore environment secret BUILD_SOURCE_TOKEN to a repository-scoped token with Contents and Workflows write permissions."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check prepared build inputs
        run: |
          [[ "$BUILD" =~ ^[1-9][0-9]*$ ]] && [[ "$ARTIFACT" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/ios-upload
          merge-multiple: true
      - run: brew install asc
      - name: App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ASC_PRIVATE_KEY_PATH="$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_PRIVATE_KEY_PATH=$ASC_PRIVATE_KEY_PATH" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/ios-upload" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$ASC_PRIVATE_KEY_PATH")"
          chmod 700 "$(dirname "$ASC_PRIVATE_KEY_PATH")"
          (umask 077 && printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_PRIVATE_KEY_PATH")
          grep -q 'BEGIN PRIVATE KEY' "$ASC_PRIVATE_KEY_PATH" || { echo "::error::ASC_PRIVATE_KEY is not a .p8 key"; exit 1; }
      - name: Verify prepared build and upload
        run: |
          set -euo pipefail
          unzip -q "$OUT/Ox.ipa" -d "$OUT/payload"
          app="$OUT/payload/Payload/Ox.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "$OX_BUNDLE_IDENTIFIER"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          codesign --verify --deep --strict "$app"
          asc builds upload --app "$OX_BUNDLE_IDENTIFIER" --ipa "$OUT/Ox.ipa" --version "$version" --build-number "$BUILD" --wait
      - name: Record build source
        if: inputs.mode == 'upload'
        env:
          GH_TOKEN: ${{ secrets.BUILD_SOURCE_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/ios-build-$BUILD" -f sha="$GITHUB_SHA"
      - name: Assign to TestFlight gamma
        if: inputs.mode == 'upload'
        run: |
          set -euo pipefail
          build=(--app "$OX_BUNDLE_IDENTIFIER" --build-number "$BUILD" --platform IOS)
          asc builds test-notes update "${build[@]}" --locale en-US --whats-new "$(git log -1 --format=%s)"
          asc builds add-groups "${build[@]}" --group gamma | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Assigned build $BUILD to gamma. External beta review submission is manual." >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
