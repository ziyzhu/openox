<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 1374" width="866" height="1374" fill="#1f1f1f" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" role="img" aria-labelledby="title description">
  <title id="title">OpenOx architecture</title>
  <desc id="description">The Client connects to the Host API and Agent. The Agent uses a provider-neutral model adapter and a sandboxed VM. The VM reads and writes Profile files, creates services and skills in the Local Repository, and uses a catalog of local and remote sources to reach device, web, and MCP service interfaces.</desc>
